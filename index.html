<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>読書カウンター</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <button id="loginBtn">Googleでログイン</button>
    <button id="logoutBtn" style="display:none">ログアウト</button>
    <h1 id="year"></h1>

    <div class="counter">
        <span id="count">0</span> / 50 冊
    </div>

    <div class="year-select">
        <select id="yearSelect"></select>
    </div>

    <h3 id="yearListTitle"></h3>
    <ul id="yearBookList"></ul>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <input id="title" placeholder="タイトル（任意）" />
    <input id="finishedDate" type="date" />

    <div class="media">
        <label><input type="radio" name="media" value="紙" checked>紙</label>
        <label><input type="radio" name="media" value="Kindle">Kindle</label>
        <label><input type="radio" name="media" value="図書館">図書館</label>
        <label><input type="radio" name="media" value="メルカリ">メルカリ</label>
    </div>

    <button id="search">表紙検索</button>
    <div id="preview"></div>

    <div class="rating">
        <label>評価：</label>
        <select id="rating">
            <option value="">--</option>
            <option value="5">★★★★★</option>
            <option value="4">★★★★☆</option>
            <option value="3">★★★☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="1">★☆☆☆☆</option>
        </select>
    </div>

    <div class="comment">
        <textarea id="comment" placeholder="一言コメント（任意）"></textarea>
    </div>

    <button id="add">読了！</button>

    <h2>📅 カレンダー</h2>
    <div class="calendar-nav">
        <button id="prevMonth">←</button>
        <span id="monthLabel"></span>
        <button id="nextMonth">→</button>
    </div>
    <div id="calendar" class="calendar"></div>

    <h2>📚 読書ログ</h2>
    <ul id="bookList"></ul>

    <script type="module" src="app.js"></script>
</body>

</html>
